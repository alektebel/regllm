# Autoresearch configuration — overlays training/config.yaml
# Controls the self-improving research loop.

# ── Research objectives ────────────────────────────────────────────────
# These define what the loop tries to improve in each iteration.
objectives:
  tool_calling:
    enabled: true
    target_tools:
      - trace_dependencies
      - inspect_lineage
      - search_docs
      - search_regulation
      - get_field_definition
    eval_set: "training/data/tool_selection_manifest.json"

  spanish_analysis:
    enabled: true
    # Categories of Spanish regulatory queries to generate/evaluate
    categories:
      - lineage
      - regulation
      - field_definition
      - cross_reference
      - bug_detection
      - data_quality

  knowledge_base:
    enabled: true
    # How many research iterations before triggering a KB sync
    sync_every_n_experiments: 3
    # Max insights per experiment to store in the KG
    max_insights_per_experiment: 5

# ── Synthetic data generation ──────────────────────────────────────────
synthesis:
  # Number of synthetic examples to generate per iteration
  n_tool_calling: 200
  n_spanish_cases: 100
  # Mix of difficulty levels
  difficulty_mix:
    easy: 0.4
    medium: 0.4
    hard: 0.2
  # Output directories (relative to project root)
  output_dir: "autoresearch/data/sft"

# ── Evaluation ─────────────────────────────────────────────────────────
evaluation:
  # Batch evaluation on the golden dataset
  golden_dataset: "data/eval_dataset.json"
  # Tool-selection accuracy threshold to consider "improvement"
  accuracy_threshold: 0.75
  # Per-iteration timeout for evaluation in seconds
  eval_timeout: 600

# ── Training overrides ─────────────────────────────────────────────────
training:
  # Phase 2 SFT overrides for research iterations
  phase2_overrides:
    num_train_epochs: 4
    learning_rate: 1.0e-4
    lora:
      r: 32
      lora_alpha: 32
  # Which base model to start from
  base_model: "Qwen/Qwen3-4B"

# ── Knowledge graph ────────────────────────────────────────────────────
knowledge_graph:
  graph_db: "data/knowledge/regllm.kuzu"
  vector_db: "data/knowledge/vectors"

# ── Research loop ──────────────────────────────────────────────────────
loop:
  # Maximum iterations before auto-stop
  max_iterations: 10
  # Stop if accuracy hasn't improved in this many iterations
  early_stop_patience: 3
  # Path to store experiment logs
  log_dir: "autoresearch/logs"

# ── MLflow experiment tracking ─────────────────────────────────────────
mlflow:
  enabled: true
  experiment_name: "regllm-tool-calling"
  tracking_uri: "sqlite:///autoresearch/mlflow.db"
