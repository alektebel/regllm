# RegLLM Qwen3 fine-tuning — multi-phase hyperspecialization
# Phase 1: Continued pretraining (full params) on domain corpus
# Phase 2: SFT (QLoRA) on 5 specialized phase datasets:
#   phase1.1_tool_calling — tool invocation patterns (44 ej.)
#   phase1.2_reasoning    — multi-step investigative reasoning (57 ej.)
#   phase2.1_learning     — knowledge graph learning interactions (66 ej.)
#   phase2.2_organizing   — knowledge organization (10 ej.)
#   phase2.3_retrieval    — fragile retrieval precision (47 ej.)
# Total: 224 ejemplos (201 train / 23 eval, split 90/10)

# ── Base model ─────────────────────────────────────────────────────────────
base_model: "Qwen/Qwen3-4B"

# ── Phase 1: Continued Pretraining (full parameter) ──────────────────────
# Rewrites model weights with domain knowledge: Spanish credit risk,
# DB schemas, SAS code, regulation text, KG patterns.
phase1:
  output_dir: "training/output/phase1-domain-pretrain"
  dataset: "training/data/phase1_corpus.txt"  # raw domain text
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16  # effective batch = 16
  learning_rate: 5.0e-5            # lower LR for continued pretraining
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  max_seq_length: 4096
  bf16: true
  logging_steps: 25
  save_steps: 500
  save_total_limit: 2
  seed: 42
  # Memory optimization for full FT on 16GB VRAM
  gradient_checkpointing: true
  optim: "adamw_8bit"              # 8-bit Adam to halve optimizer memory
  # Unsloth handles this natively; for HF use DeepSpeed ZeRO-3 + CPU offload

# ── Phase 2: SFT with QLoRA ─────────────────────────────────────────────
# Teaches task behavior (tool calling, investigation flow, Spanish tone)
# on top of the domain-pretrained model.
phase2:
  base_model_override: null  # train directly on Qwen3-4B (skip phase1 for tool-calling SFT)
  output_dir: "training/output/phase2-sft"
  lora:
    r: 64
    lora_alpha: 64
    lora_dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    bias: "none"
  dataset:
    train_file: "training/data/phase_sft_train.jsonl"
    eval_file: "training/data/phase_sft_eval.jsonl"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  max_seq_length: 2048  # max example is ~1767 tokens with tool schemas
  bf16: true
  logging_steps: 10
  save_steps: 200
  eval_steps: 200
  save_total_limit: 3
  seed: 42

# ── Dataset generation config ────────────────────────────────────────────
dataset:
  # Mix ratios for Phase 2 synthetic data
  mix:
    tool_calling: 0.30
    schema_knowledge: 0.20
    regulation_qa: 0.20
    graph_traversal: 0.15
    credit_risk: 0.15

# ── Domain corpus sources (Phase 1) ─────────────────────────────────────
domains:
  language: "es"
  sources:
    - path: "data/samples/irb_schema.sql"
      type: "schema"
      repeat: 5                    # repeat important docs to weight them
    - path: "data/regulation/"
      type: "regulation"
      repeat: 3
    - path: "data/docs/"
      type: "documentation"
      repeat: 2
    - path: "data/samples/sample_lgd.sas"
      type: "sas_code"
      repeat: 3
    - path: "src/knowledge/ontology.py"
      type: "kg_ontology"
      repeat: 2
  terminology:
    - "riesgo de credito"
    - "COREP/FINREP"
    - "IRB"
    - "PD, LGD, EAD, CCF, RWA, ECL"
    - "provisiones, dotaciones, stage IFRS9"
    - "Circular 4/2017 BdE"
    - "CRR/CRD"
    - "segmento IRB"

# ── Export ────────────────────────────────────────────────────────────────
export:
  quantization: "q4_K_M"
  ollama_model_name: "regllm-4b-sft"
