# Qwen3-8B on Vast (3090 24GB) — Unsloth 4-bit from HuggingFace (no git clone).
base_model: "Qwen/Qwen3-8B-Instruct"

phase1:
  output_dir: "training/output/phase1-qwen3-8b-cpt"
  dataset: "training/data/phase1_corpus.txt"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_seq_length: 2048
  bf16: true
  logging_steps: 10
  save_steps: 200
  save_total_limit: 1
  seed: 42
  gradient_checkpointing: true
  optim: "adamw_8bit"
  # 8B full FT OOMs on 24GB — domain CPT via QLoRA on cloned base
  load_in_4bit: true
  lora_r: 64
  lora_alpha: 64

phase2:
  base_model_override: null
  output_dir: "training/output/phase2-qwen3-8b-sft"
  lora:
    r: 32
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    bias: "none"
  dataset:
    train_file: "training/data/agent_sft_train.jsonl"
    eval_file: "training/data/agent_sft_eval.jsonl"
  num_train_epochs: 3
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  max_seq_length: 2048
  bf16: true
  logging_steps: 10
  save_steps: 100
  eval_steps: 100
  save_total_limit: 2
  seed: 42

export:
  quantization: "q4_K_M"
  ollama_model_name: "regllm-qwen3-8b"
