# RegLLM — full local stack (Linux / macOS / Windows via Docker Desktop).
#
#   docker compose up --build           start everything (Ollama + API + Web)
#   docker compose down                 stop and remove containers
#   docker compose down -v              also drop the cached Ollama models (~9 GB)
#
# Open http://localhost:3010/diff (diff explainer) or /trace (field lineage) once `web` is healthy.
#
# Configuration via .env (see .env.example):
#   OLLAMA_MODEL   model tag pulled on first run (default: qwen2.5:14b-instruct-q4_K_M)
#   API_PORT       host port for the FastAPI service  (default: 8000)
#   WEB_PORT       host port for the Next.js frontend (default: 3010)
#   OLLAMA_PORT    host port for the Ollama server    (default: 11434)
#
# To use a host-installed Ollama instead of the dockerised one:
#   docker compose up --build api web         (skip the ollama services)
#   API picks the host via OLLAMA_URL=http://host.docker.internal:11434

name: regllm

services:
  ollama:
    image: ollama/ollama:latest
    container_name: regllm-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: regllm-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      MODEL_TAG: "${OLLAMA_MODEL:-none}"
    entrypoint: ["/bin/sh", "-c"]
    # `$$` escapes to a literal `$` so docker-compose doesn't try to interpolate.
    command:
      - |
        set -e
        if [ "$$MODEL_TAG" = "none" ] || [ -z "$$MODEL_TAG" ]; then
          echo "[init] OLLAMA_MODEL=none — skipping model pull (stub mode)"
          exit 0
        fi
        if ollama list 2>/dev/null | tail -n +2 | awk '{print $$1}' | grep -qx "$$MODEL_TAG"; then
          echo "[init] $$MODEL_TAG already present in Ollama cache"
        else
          echo "[init] pulling $$MODEL_TAG (this can take a while on first run)…"
          ollama pull "$$MODEL_TAG"
          echo "[init] $$MODEL_TAG ready"
        fi
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: regllm-api:latest
    container_name: regllm-api
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: INFO
      CORS_ORIGINS: "http://localhost:${WEB_PORT:-3010},http://localhost:3000"
      REGLLM_LLM: "auto"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-none}"
      LITERT_URL: "http://host.docker.internal:9379/v1"
      LITERT_MODEL: "gemma4-12b,gpu"
      REGLLM_LLM_TIMEOUT: "240"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        INTERNAL_API_URL: "http://api:8000"
    image: regllm-web:latest
    container_name: regllm-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3010}:3010"
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: "http://api:8000"
      PORT: "3010"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http').get('http://localhost:3010',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  ollama-models:
