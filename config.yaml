# RegLLM model configuration
# Models are loaded locally via Ollama from GGUF files.
# Set model to an Ollama tag ("qwen3:30b-a3b") or a local GGUF path
# ("/home/user/models/qwen3-30b-a3b.gguf") — GGUF files are auto-registered in Ollama.
#
# For a standalone GGUF backend (no Ollama server — loads the weight file
# directly in-process via llama-cpp-python), set backend: "gguf" and
# gguf_model_path below instead. See docs/DEPLOYMENT.md.
#
# For Amazon Bedrock (managed, no local weights at all), set backend:
# "bedrock" and bedrock_model_id/bedrock_region below. Auth is via the
# standard AWS credential chain (IAM role, ~/.aws/credentials, or
# AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env vars) — nothing to configure
# here beyond the model/region. See docs/DEPLOYMENT.md.

# Chat/reasoning LLM — maintains the knowledge graph, runs agentic Q&A
llm:
  model: "regllm-4b-sft"   # SFT tool-calling (~85.8% eval); base: qwen3:4b
  backend: "auto"            # auto | ollama | litert | gguf | bedrock | azure | api | stub
  ollama_url: "http://localhost:11434"
  litert_url: "http://localhost:9379/v1"
  litert_model: "gemma4-12b,gpu"
  # gguf_model_path: "/home/user/models/qwen3-8b-instruct.Q4_K_M.gguf"
  # gguf_n_ctx: 8192
  # gguf_n_gpu_layers: 0     # >0 to offload layers to GPU
  # bedrock_model_id: "eu.amazon.nova-micro-v1:0"
  # bedrock_region: "eu-west-1"
  # inspect_bedrock_model_id: "eu.amazon.nova-micro-v1:0"  # cheap model for
  #   the per-upload inspection step when generation uses a stronger Bedrock
  #   model (env: INSPECT_BEDROCK_MODEL_ID). Falls back to bedrock_model_id.
  # For Azure OpenAI (managed, Azure deployments — see DQC/azure/deploy.sh),
  # set backend: "azure" and the keys below (or the AZURE_OPENAI_* env vars):
  # azure_endpoint: "https://<resource>.openai.azure.com"
  # azure_api_key: "..."          # prefer the AZURE_OPENAI_API_KEY env var
  # azure_deployment: "gpt-4o-mini"
  # azure_api_version: "2024-06-01"
  #
  # For a generic HTTP inference gateway — an AWS API Gateway fronting
  # Bedrock, or an OpenAI-compatible gateway (e.g. AWS Bedrock Access
  # Gateway) — set backend: "api" and the keys below (env vars override).
  # See docs/REGLLM_API.md.
  # api_url: "https://<api-id>.execute-api.eu-west-1.amazonaws.com/prod"  # REGLLM_API_URL
  # api_key: "..."                 # REGLLM_API_KEY (prefer the env var)
  # api_key_header: "Authorization"  # REGLLM_API_KEY_HEADER; "x-api-key" for API-Gateway keys
  # api_model: "amazon.nova-micro-v1:0"  # REGLLM_API_MODEL — model name the gateway expects
  #
  # Fallback when the preferred backend is unavailable or a call fails
  # (env: REGLLM_LLM_FALLBACK). "stub" (default) or "gguf" — a local weight
  # file, needs gguf_model_path below + llama-cpp-python installed. With
  # "gguf" the app keeps working offline if the remote API/Bedrock is down.
  # fallback: "gguf"
  timeout: 300

  # ── Excel inspection / sheet-mapping step ──────────────────────────────
  # This runs on every upload but only picks which sheet is the dictionary
  # and maps its columns — a tiny structured task. Point it at a small, fast
  # model so inspection stays snappy instead of paying for the full chat
  # model above. Leave both unset to reuse `model`.
  #
  # Option A — Ollama tag or a .gguf path (auto-registered into Ollama):
  inspect_model: "qwen3:1.7b"
  #
  # Option B — standalone GGUF weights loaded in-process (llama-cpp-python,
  # no Ollama server). Takes precedence over inspect_model when set:
  # inspect_gguf_model_path: "/home/user/models/qwen3-1.7b-instruct.Q4_K_M.gguf"
  # inspect_gguf_n_ctx: 4096
  # inspect_gguf_n_gpu_layers: 0    # >0 to offload layers to GPU

# Embedding model — encodes regulation text into the vector store.
# Used both by the ChromaDB-backed knowledge-graph RAG (src/knowledge/
# vector_store.py) and the dependency-free regulation RAG
# (src/knowledge/regulation_vector_store.py, scripts/build_regulation_embeddings.py).
# DQC field retrieval (Tier-1 schema-linking filter). Off by default: field
# selection is lexical only. Set REGLLM_DQC_SEMANTIC_FIELDS=1 to blend in a
# semantic channel using the embedding model below, so fields relevant to a
# rule but sharing no literal words are still surfaced. Needs an embedding
# backend reachable (Ollama/Bedrock); degrades to lexical if not.

embedding:
  model: "nomic-embed-text"  # local GGUF via Ollama
  dim: 768
  backend: "auto"             # auto | ollama | gguf | bedrock | stub
  ollama_url: "http://localhost:11434"
  # gguf_model_path: "/home/user/models/nomic-embed-text-v1.5.Q8_0.gguf"
  # bedrock_embed_model_id: "amazon.titan-embed-text-v2:0"
  # bedrock_region: "eu-west-1"

# Knowledge graph persistence paths
knowledge:
  graph_db: "data/knowledge/graph"
  vector_db: "data/knowledge/vectors"
  collection: "regllm"
