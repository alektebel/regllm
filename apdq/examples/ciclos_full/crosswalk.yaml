# This file is the evidence for gap-plan item 2's original gate
# (docs/MVP_ROADMAP.md item 2 / apdq/README.md "honest status"): the
# manifest-driven generators reproduce the *coverage* of the hand-written
# 67-defect catalog. tests/test_apdq.py::test_crosswalk_is_total asserts
# (a) every catalog defect id appears here, and (b) every mapped APDQ id
# is actually generated by the manifest.
#
# status: mapped    — the generated defect plants and catches the same
#                     invariant violation (class-level equivalence);
#         partial   — covered with a documented simplification;
#         excluded  — not a defect (decoys) or out of generic scope,
#                     with the reason on its face.

