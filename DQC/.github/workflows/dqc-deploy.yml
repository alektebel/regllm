name: DQC Deploy

on:
  push:
    branches: [main]
    paths:
      - 'DQC/**'
      - 'api/**'
      - 'src/**'

env:
  AWS_REGION: eu-west-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/regllm-dqc-api:latest .
          docker push ${{ steps.ecr.outputs.registry }}/regllm-dqc-api:latest

      - name: Build & push DQC image
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/regllm-dqc-dqc:latest DQC/app/
          docker push ${{ steps.ecr.outputs.registry }}/regllm-dqc-dqc:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: DQC/terraform
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="vpc_id=${{ secrets.VPC_ID }}" \
            -var="subnet_ids=${{ secrets.SUBNET_IDS }}"

      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster regllm-dqc \
            --service regllm-dqc \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}
