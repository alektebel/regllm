name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu --quiet

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate V2/V3 sample data
        run: python scripts/generate_v3.py

      - name: Run tests
        run: pytest -q

      # DQC eval harness gates — every oracle must hold (0 rows on clean,
      # all planted rows on its trap) and the field × article coverage
      # matrix must have no TODO cells.
      - name: DQC eval — oracle self-test
        run: python DQC/eval/eval_harness.py --selftest

      - name: DQC eval — coverage matrix gate
        run: python DQC/eval/coverage_matrix.py --fail-under 1.0

      - name: DQC eval — golden traces self-test
        run: python DQC/eval/golden_eval.py --selftest
