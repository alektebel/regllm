name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  # NEXT_PUBLIC_API_URL must be baked into the Next.js build at image build time.
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

jobs:
  # ── Build & push both images to ECR ────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Derive ECR base URL from caller identity (avoids passing account ID as output)
      - name: Set ECR base URL
        id: ecr-base
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "url=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────────────────
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.api
          push:    true
          tags: |
            ${{ steps.ecr-base.outputs.url }}/regllm-api-${{ env.DEPLOY_ENV }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-base.outputs.url }}/regllm-api-${{ env.DEPLOY_ENV }}:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,mode=max,scope=api

      # ── Frontend image ─────────────────────────────────────────────────────
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    true
          tags: |
            ${{ steps.ecr-base.outputs.url }}/regllm-frontend-${{ env.DEPLOY_ENV }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr-base.outputs.url }}/regllm-frontend-${{ env.DEPLOY_ENV }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend

  # ── Deploy to ECS ───────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      # Derive ECR base URL again in this job (cross-job outputs of account IDs get masked)
      - name: Set ECR base URL
        id: ecr-base
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "url=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition regllm-app \
            --query taskDefinition \
          | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy) |
                .containerDefinitions |= map(
                  del(.healthCheck) |
                  if .dependsOn then
                    .dependsOn |= map(if .condition == "HEALTHY" then .condition = "START" else . end)
                  else . end
                )' \
            > task-definition.json

      - name: Update API container image in task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   regllm-api
          image: ${{ steps.ecr-base.outputs.url }}/regllm-api-${{ env.DEPLOY_ENV }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Update frontend container image in task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  ${{ steps.render-api.outputs.task-definition }}
          container-name:   regllm-frontend
          image: ${{ steps.ecr-base.outputs.url }}/regllm-frontend-${{ env.DEPLOY_ENV }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy to ECS (rolling update with circuit breaker)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.render-frontend.outputs.task-definition }}
          service:                    regllm-app-${{ env.DEPLOY_ENV }}
          cluster:                    regllm-${{ env.DEPLOY_ENV }}
          wait-for-service-stability: true
