name: Deploy to AWS ECS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, prod]

permissions:
  id-token: write   # Required for OIDC
  contents: read

env:
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  # The ALB DNS is stable after the first terraform apply.
  # NEXT_PUBLIC_API_URL must be baked into the Next.js build at image build time.
  NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

jobs:
  # ── Build & push both images to ECR ────────────────────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      api-image:      ${{ steps.build-api.outputs.imageid }}
      frontend-image: ${{ steps.build-frontend.outputs.imageid }}
      image-tag:      ${{ steps.tag.outputs.tag }}
      ecr-registry:   ${{ steps.login-ecr.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag (short SHA)
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── API image ──────────────────────────────────────────────────────────
      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile.api
          push:    true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/regllm-api-${{ env.DEPLOY_ENV }}:${{ steps.tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/regllm-api-${{ env.DEPLOY_ENV }}:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,mode=max,scope=api

      # ── Frontend image ─────────────────────────────────────────────────────
      - name: Build and push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file:    ./frontend/Dockerfile
          push:    true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/regllm-frontend-${{ env.DEPLOY_ENV }}:${{ steps.tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/regllm-frontend-${{ env.DEPLOY_ENV }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,mode=max,scope=frontend

  # ── Deploy to ECS ───────────────────────────────────────────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition regllm-app \
            --query taskDefinition \
            > task-definition.json

      - name: Update API container image in task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  task-definition.json
          container-name:   regllm-api
          image: >-
            ${{ needs.build-and-push.outputs.ecr-registry }}/regllm-api-${{ env.DEPLOY_ENV }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Update frontend container image in task definition
        id: render-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition:  ${{ steps.render-api.outputs.task-definition }}
          container-name:   regllm-frontend
          image: >-
            ${{ needs.build-and-push.outputs.ecr-registry }}/regllm-frontend-${{ env.DEPLOY_ENV }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Deploy to ECS (rolling update with circuit breaker)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:           ${{ steps.render-frontend.outputs.task-definition }}
          service:                   regllm-app-${{ env.DEPLOY_ENV }}
          cluster:                   regllm-${{ env.DEPLOY_ENV }}
          wait-for-service-stability: true
